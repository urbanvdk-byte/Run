name: Update running diary

on:
  push:
    branches: [main]
    paths:
      - update_run.py

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Update diary
        run: python update_run.py

      - name: Commit updated diary
        run: |
          if git diff --quiet -- index.html; then
            echo "No diary changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Update running diary"
          git push
